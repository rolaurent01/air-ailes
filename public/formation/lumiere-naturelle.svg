<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#111111"/>
  <!-- Soleil bas sur l'horizon -->
  <path d="M90,270 A40,40 0 0 1 170,270" fill="none" stroke="#F0EDE8" stroke-width="1.2"/>
  <path d="M75,270 A55,55 0 0 1 185,270" fill="none" stroke="#F0EDE8" stroke-width="0.3" stroke-opacity="0.3"/>
  <!-- Rayons rasants -->
  <line x1="180" y1="250" x2="560" y2="232" stroke="#F0EDE8" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="180" y1="260" x2="560" y2="252" stroke="#F0EDE8" stroke-width="0.6" stroke-opacity="0.25"/>
  <line x1="176" y1="240" x2="560" y2="210" stroke="#F0EDE8" stroke-width="0.6" stroke-opacity="0.2"/>
  <!-- Horizon -->
  <line x1="40" y1="270" x2="560" y2="270" stroke="#7A7A72" stroke-width="0.8"/>
  <!-- Poteau et ombre longue -->
  <line x1="330" y1="270" x2="330" y2="200" stroke="#F0EDE8" stroke-width="1.2"/>
  <path d="M330,270 L540,286 L540,290 L330,272 Z" fill="#7A7A72" fill-opacity="0.45" stroke="none"/>
  <!-- Herbes -->
  <path d="M250,270 L246,258 M256,270 L258,256 M410,270 L406,260 M416,270 L419,257" fill="none" stroke="#7A7A72" stroke-width="0.6"/>
  <!-- Sol -->
  <line x1="60" y1="310" x2="540" y2="310" stroke="#7A7A72" stroke-width="0.4" stroke-opacity="0.4"/>
</svg>
